[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opsmcp"
version = "0.1.0"
description = "Read-only tenant-scoped SaaS operations MCP server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=1.12,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
opsmcp = "opsmcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/opsmcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
